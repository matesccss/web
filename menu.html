<script>

document.addEventListener("DOMContentLoaded", () => {

    const boton = document.getElementById("menuHamburguesa");
    const contenido = document.getElementById("menuContenido");

    if (!boton || !contenido) return;

    boton.addEventListener("click", () => {

        contenido.classList.toggle("menu-abierto");

        boton.classList.toggle("activo");

    });


    const desplegables =
        document.querySelectorAll(".dropdown-btn");

    desplegables.forEach(boton => {

        boton.addEventListener("click", event => {

            if (window.innerWidth <= 768) {

                event.stopPropagation();

                const dropdown =
                    boton.parentElement;

                dropdown.classList.toggle("abierto");

            }

        });

    });

});

</script>
