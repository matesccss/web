<script>

/* =========================================================
   MENÚ
========================================================= */

(function () {

    const boton =
        document.getElementById("menuHamburguesa");

    const contenido =
        document.getElementById("menuContenido");


    if (!boton || !contenido) return;


    /* =====================================================
       HAMBURGUESA
    ===================================================== */

    boton.addEventListener("click", function () {

        const abierto =
            contenido.classList.toggle("menu-abierto");


        boton.classList.toggle(
            "activo",
            abierto
        );


        boton.setAttribute(
            "aria-expanded",
            abierto
        );

    });


    /* =====================================================
       DESPLEGABLES EN MÓVIL
    ===================================================== */

    const desplegables =
        document.querySelectorAll(".dropdown-btn");


    desplegables.forEach(function (botonDropdown) {

        botonDropdown.addEventListener(
            "click",
            function (event) {

                if (window.innerWidth <= 768) {

                    event.stopPropagation();


                    const dropdown =
                        botonDropdown.parentElement;


                    dropdown.classList.toggle(
                        "abierto"
                    );

                }

            }
        );

    });

})();

</script>
